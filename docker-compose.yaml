services:
  app:
    image: ${IMAGE:-mraddict063/friends-in-parallel:latest}
    init: true
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - '4500:4500'
    environment:
      PORT: '4500'
      DATA_DIR: /data
      PUSHPLUS_TOKEN: ${PUSHPLUS_TOKEN:-}
      PUSHPLUS_TOPIC: ${PUSHPLUS_TOPIC:-}
      SITE_URL: ${SITE_URL:-}
    volumes:
      - parallel-data:/data

volumes:
  parallel-data:
