name: Docker

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: mraddict063/friends-in-parallel

  # Push for:
  # - pushes to main
  # - manual workflow runs
  # - pull requests whose branch is inside this repository
  #
  # Fork pull requests only build because repository secrets are unavailable.
  SHOULD_PUSH: >-
    ${{
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    }}

jobs:
  docker:
    name: Build (${{ matrix.arch }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04

          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: mraddict063
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: >-
            type=image,
            name=${{ env.IMAGE }},
            push-by-digest=true,
            name-canonical=true,
            push=${{ env.SHOULD_PUSH == 'true' }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Export digest
        if: env.SHOULD_PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: env.SHOULD_PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image
    needs: docker

    # Publish from main, manual runs, and same-repository PRs.
    # Fork PRs are excluded because they cannot access DOCKERHUB_TOKEN.
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      }}

    runs-on: ubuntu-24.04

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: mraddict063
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish latest multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          images=()

          for digest in *; do
            images+=("$IMAGE@sha256:$digest")
          done

          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            "${images[@]}"

          docker buildx imagetools inspect "$IMAGE:latest"
